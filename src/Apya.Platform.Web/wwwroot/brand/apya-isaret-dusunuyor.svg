<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- APYA işareti, "düşünüyor" durumu — CSS maskesi olarak kullanılır (apya-mark.css "YÜKLENİYOR"). Geometri ve zamanlama marka paketinden: 1800 ms nefes, ışın başına 55 ms. -->
  <style>line{transform-box:view-box;transform-origin:50px 50px;opacity:.2;animation:t 1.8s ease-in-out infinite}@keyframes t{0%,100%{opacity:.18;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){line{animation:none;opacity:.4}}</style>
  <g fill="none" stroke="#000" stroke-width="6">
    <g transform="rotate(0.00 50 50)"><line style="animation-delay:0.000s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(27.69 50 50)"><line style="animation-delay:0.055s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(55.38 50 50)"><line style="animation-delay:0.110s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(83.08 50 50)"><line style="animation-delay:0.165s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(110.77 50 50)"><line style="animation-delay:0.220s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(138.46 50 50)"><line style="animation-delay:0.275s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(166.15 50 50)"><line style="animation-delay:0.330s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(193.85 50 50)"><line style="animation-delay:0.385s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(221.54 50 50)"><line style="animation-delay:0.440s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(249.23 50 50)"><line style="animation-delay:0.495s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(276.92 50 50)"><line style="animation-delay:0.550s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(304.62 50 50)"><line style="animation-delay:0.605s" x1="50" y1="20" x2="50" y2="4"/></g>
    <g transform="rotate(332.31 50 50)"><line style="animation-delay:0.660s" x1="50" y1="20" x2="50" y2="4"/></g>
  </g>
  <polygon points="50,36 55.5,50 50,52 44.5,50" fill="#000"/>
